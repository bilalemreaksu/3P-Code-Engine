name: CI
on:
  pull_request:
  push:
  merge_group:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dependency security audit
        run: npm audit --audit-level=high
  docker-isolation:
    name: Docker isolation (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE_MODE_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:isolation:required
